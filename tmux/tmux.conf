## Install tmux plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'olimorris/tmux-pomodoro-plus' # https://github.com/olimorris/tmux-pomodoro-plus
set -g @plugin 'omerxx/tmux-sessionx' # Install tmux-sessionx (<leader>+o)

# Change the keybinding for tmux-sessionx to open it with LOWERCASE 'o' for less keypress (default is UPPERCASE 'O')
set -g @sessionx-bind 'o'

#   tmux-copycat keybinds:
#    prefix + ctrl-f - simple file search
#    prefix + ctrl-g - jumping over git status files (best used after git status command)
#    prefix + alt-h  - jumping over SHA-1/SHA-256 hashes (best used after git log command)
#    prefix + ctrl-u - url search (http, ftp and git urls)
#    prefix + ctrl-d - number search (mnemonic d, as digit)
#    prefix + alt-i  - ip address search
set -g @plugin 'tmux-plugins/tmux-copycat'  # Get some tricky find keybinds
set -g @plugin 'tmux-plugins/tmux-yank'     # Change yank to clipboard
set -g @yank_selection_mouse 'clipboard' # or 'primary' or 'secondary'
set -g @yank_with_mouse on
set -g @yank_action 'copy-pipe' # (default) or 'copy-pipe-and-cancel'

# tmux-open keybinds
# in the copy-mode
#    o - "open" a highlighted selection with the system default program. open for OS X or xdg-open for Linux.
#    Ctrl-o - open a highlighted selection with the $EDITOR
#    Shift-s - search the highlighted selection directly inside a search engine (defaults to google).
set -g @plugin 'tmux-plugins/tmux-open'
setenv -g EDITOR "/usr/bin/nvim"


# Plugin to save and restore sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Plugin to saves automatically and allows for automatically restoring from the last save when tmux is started
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

# Change the base index, because the "0" is too far from `
set -g base-index 1

# Automatically set window title
set-option -g set-titles on

# Change color to avoid error on vim themes
#set -g default-terminal "xterm-256color"
#set-option -ga terminal-overrides ",xterm-256color*:Tc:smso"

# Old config
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

set -g status-keys vi
set -g history-limit 50000
set -g focus-events on

# Fix the problem of ctrl + arrow in vim
set-window-option -g xterm-keys on

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Enable mouse
setw -g mouse on
setw -g monitor-activity on

# Configure panes to show its name
set -g pane-border-status top
set -g pane-border-format " [ #P: #T ] "
# Check if the string is empty or not. If it's empty, clear the manual title flag (allows fish_title to auto-update),
# otherwise set the pane title and mark it as manually named (prevents fish_title from overwriting it).
bind-key \; command-prompt -p "Pane name:" "if-shell -F '#{==:%1,}' \
    'set-option -p @manual_title \"\"; select-pane -T \"\"' \
    'set-option -p @manual_title \"1\"; select-pane -T \"%1\"'"

# Set keys to split window
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Set the vim keys to resize pane
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5
bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R
bind-key -r i run-shell "tmux neww tmux-cht.sh"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n C-S-h  previous-window
bind -n C-S-l  next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.config/tmux/tmux.conf

# Search active keybindings with fzf popup
bind-key ? display-popup -E -w 85% -h 75% "tmux list-keys | fzf --reverse --header='Active Tmux Keybindings (ESC to exit)'"

set -g default-command ""
set-option -g default-shell /usr/bin/fish

# Propagate the Wayland socket and Hyprland instance (needed by hyprctl) into tmux sessions on attach
set -ga update-environment "WAYLAND_DISPLAY"
set -ga update-environment "HYPRLAND_INSTANCE_SIGNATURE"
# GUI apps launched from a pane need the desktop's Wayland/GTK/Qt/Electron hints
set -ga update-environment "GDK_SCALE"
set -ga update-environment "GDK_BACKEND"
set -ga update-environment "QT_QPA_PLATFORM"
set -ga update-environment "QT_QPA_PLATFORMTHEME"
set -ga update-environment "ELECTRON_OZONE_PLATFORM_HINT"
set -ga update-environment "OZONE_PLATFORM"
set -ga update-environment "MOZ_ENABLE_WAYLAND"
set -ga update-environment "XCURSOR_SIZE"
set -ga update-environment "HYPRCURSOR_SIZE"
set -ga update-environment "OMARCHY_PATH"

# THEME
set -g status-interval 60
set -g status-left-length 30
set -g status-right-length 50

# Dynamic theme: inherits terminal background & palette (adapts to light/dark themes)
set -g status-style "bg=default,fg=default"
set -g window-status-separator ""
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g window-status-style "default"
set -g window-status-activity-style "default"
set -g window-status-bell-style "default"
set -g window-status-current-style "default"
set -g status-left-style "default"
set -g status-right-style "default"

# Status widgets (uses fg=default for text and clock so it's readable in both light and dark themes)
set -g status-left '#[fg=green](#S) #[fg=default]#(whoami) #{pomodoro_status} '
set -g status-right '\
#[fg=yellow]#(awk "/MemAvailable/{free=\$2} /MemTotal/{total=\$2} END{printf \"%2.1f\", ((total - free)*100)/total}" /proc/meminfo)% RAM #[default]\
#[fg=green]#(awk "/SwapFree/{free=\$2} /SwapTotal/{total=\$2} END{printf \"%2.1f\", ((total - free)*100)/total}" /proc/meminfo)% SWAP #[default]\
#[fg=default]%H:%M#[default]'

# Pane borders and popups
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue


# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
